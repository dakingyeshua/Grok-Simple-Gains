[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-gains"
version = "0.1.0"
description = "Paper-trading engine for Aaron Johnson's equity ORB/ORR system"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Aaron Johnson" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
simple-gains = "simple_gains.cli:main"

[tool.setuptools.packages.find]
include = ["simple_gains*"]

[tool.setuptools.package-data]
simple_gains = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
